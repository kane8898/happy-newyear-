<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浪漫宇宙星空</title>
<style>
body{margin:0;overflow:hidden;font-family:"Microsoft YaHei";}
canvas{position:absolute;top:0;left:0;}
.text{
position:absolute;
width:100%;
text-align:center;
top:75%;
color:white;
font-size:4.5vw;
opacity:0;
transition:opacity 4s ease;
letter-spacing:3px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="message" class="text">金杨同学 · 新年快乐 · 万事胜意</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[], nebula=[], particles=[], auroraOffset=0;

function random(min,max){return Math.random()*(max-min)+min;}

/* ===== 深空渐暗背景 ===== */
function drawDeepSpace(){
  let radial=ctx.createRadialGradient(
    canvas.width/2,canvas.height/2,100,
    canvas.width/2,canvas.height/2,canvas.width
  );
  radial.addColorStop(0,"#2a003f");
  radial.addColorStop(0.4,"#12002a");
  radial.addColorStop(1,"#000010");
  ctx.fillStyle=radial;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* ===== 银河带 ===== */
function drawMilkyWay(){
  ctx.save();
  ctx.rotate(-0.3);
  let g=ctx.createLinearGradient(0,0,canvas.width,0);
  g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(0.5,"rgba(255,200,255,0.12)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;
  ctx.fillRect(-canvas.width,canvas.height/2-80,canvas.width*3,160);
  ctx.restore();
}

/* ===== 星云雾层 ===== */
for(let i=0;i<3;i++){
  nebula.push({
    x:random(0,canvas.width),
    y:random(0,canvas.height),
    r:random(200,400),
    color:["rgba(255,120,220,0.08)","rgba(120,180,255,0.08)","rgba(200,150,255,0.08)"][i]
  });
}

function drawNebula(){
  nebula.forEach(n=>{
    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
  });
}

/* ===== 多层真实星空 ===== */
for(let i=0;i<600;i++){
  stars.push({
    x:random(0,canvas.width),
    y:random(0,canvas.height),
    r:random(0.3,2.2),
    twinkle:random(0.01,0.05),
    alpha:random(0.3,1),
    color:[
      "#ffffff", // 白
      "#ffe9c4", // 暖白
      "#cce6ff", // 蓝白
      "#ffd6f5"  // 微粉
    ][Math.floor(random(0,4))]
  });
}

function drawStars(){
  stars.forEach(s=>{
    s.alpha+=s.twinkle;
    if(s.alpha>1||s.alpha<0.2) s.twinkle*=-1;
    ctx.fillStyle=`rgba(${hexToRgb(s.color)},${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

/* 颜色转换 */
function hexToRgb(hex){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  return r+","+g+","+b;
}

/* ===== 极光 ===== */
function drawAurora(){
  auroraOffset+=0.01;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    for(let x=0;x<canvas.width;x+=10){
      let y=canvas.height*0.25+
      Math.sin(x*0.004+auroraOffset+i)*40+i*35;
      ctx.lineTo(x,y);
    }
    ctx.strokeStyle="rgba(255,150,255,0.08)";
    ctx.lineWidth=50;
    ctx.stroke();
  }
}

/* ===== 烟花 ===== */
class Particle{
  constructor(x,y,color,size){
    this.x=x;
    this.y=y;
    this.angle=random(0,Math.PI*2);
    this.speed=random(2,9);
    this.life=120;
    this.color=color;
    this.size=size;
    this.friction=0.96;
    this.gravity=0.04;
  }
  update(){
    this.speed*=this.friction;
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed+this.gravity;
    this.life--;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.color;
    ctx.shadowColor=this.color;
    ctx.shadowBlur=20;
    ctx.fill();
  }
}

function explode(x,y){
  for(let i=0;i<300;i++){
    let color=`hsl(${random(290,340)},100%,70%)`;
    particles.push(new Particle(x,y,color,2));
  }
  for(let i=0;i<150;i++){
    particles.push(new Particle(x,y,"#ffd700",2.5));
  }
}

/* ===== 动画 ===== */
function animate(){
  requestAnimationFrame(animate);
  drawDeepSpace();
  drawNebula();
  drawMilkyWay();
  drawStars();
  drawAurora();

  particles=particles.filter(p=>{
    p.update();
    p.draw();
    return p.life>0;
  });
}
animate();

/* 自动烟花 */
setInterval(()=>{
  explode(random(200,canvas.width-200),random(150,canvas.height/2));
},2000);

/* 点击触发 */
document.addEventListener("click",()=>{
  explode(canvas.width/2,canvas.height/3);
  document.getElementById("message").style.opacity=1;
});
</script>

</body>
</html>
